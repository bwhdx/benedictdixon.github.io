<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#1c267a" stroke-linecap="butt">
  <!-- The five candles of the bwhdx cipher, without the letters, ink on the ochre paper. -->
  <rect width="64" height="64" rx="12" fill="#d0b57a" stroke="none"/>
  <g transform="translate(2 14) scale(0.6)" stroke-width="4.6">
    <line x1="10" x2="10" y1="25" y2="53.6"/><rect x="5.5" y="30" width="9" height="18.6" fill="#1c267a"/>
    <line x1="30" x2="30" y1="8.1" y2="53.6"/><rect x="25.5" y="13.1" width="9" height="35.5"/>
    <line x1="50" x2="50" y1="8.1" y2="43.5"/><rect x="45.5" y="13.1" width="9" height="25.4" fill="#1c267a"/>
    <line x1="70" x2="70" y1="33.5" y2="50.2"/><rect x="65.5" y="38.5" width="9" height="6.7" fill="#1c267a"/>
    <line x1="90" x2="90" y1="6.4" y2="50.2"/><rect x="85.5" y="11.4" width="9" height="33.8"/>
  </g>
</svg>
